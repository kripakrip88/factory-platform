[options]
; Каталоги модулей: сначала штатные Odoo, затем RuOdoo (российская локализация).
; Порядок важен — Odoo берёт первый найденный модуль с таким именем.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/third-party

data_dir = /var/lib/odoo

; Пароль мастер-доступа (создание/удаление баз) подставляет install.sh.
admin_passwd = __ADMIN_PASSWD__

; 2 рабочих процесса: стенд оценочный, рядом боевой ERPNext — не занимаем лишнего.
; При workers = 0 Odoo работает в один поток и не умеет long-polling.
workers = 2
max_cron_threads = 1

; Ограничения на процесс, чтобы эксперимент не выел память у прода.
;
; ВАЖНО ПРО ЭТИ ЧИСЛА: Odoo сравнивает их с ВИРТУАЛЬНОЙ памятью процесса, а она
; у python-воркера в полтора-два раза больше реального расхода. Прежние 640 МБ
; воркеры пробивали виртуальным размером, не израсходовав и трети реальной
; памяти — замер 21.09.2026: виртуальная 391-403 МБ при реальной 235-251 МБ,
; контейнер занят на 762 МБ из выданных 2 ГБ, то есть 1,2 ГБ простаивали.
; Итог: 4 самоубийства воркеров за 2,5 минуты, каждое стоило следующему
; запросу 2-3 секунды на перезагрузку реестра — это и выглядело как «страница
; загрузилась, а форма ещё не нарисована».
;
; Новые значения дают запас примерно в 2,5 раза к нынешнему виртуальному
; размеру. Считать вместе с mem_limit контейнера: процессов с лимитом три
; (2 http + 1 cron), плюс мастер и gevent — поэтому mem_limit поднят до 2,5 ГБ
; в docker-compose.yml. Менять эти числа в отрыве друг от друга нельзя:
; поднять лимит воркера, не подняв контейнер, значит обменять аккуратный
; перезапуск на настоящий OOM.
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280
limit_time_cpu = 120
limit_time_real = 240

; Стенд смотрит в интернет: список баз наружу не отдаём и менеджер баз не показываем.
; База создаётся установщиком (install.sh), поэтому её имя фиксируем здесь —
; иначе с list_db = False Odoo не поймёт, к какой базе подключаться.
list_db = False
db_name = odoo

; Стоим за infra-nginx (21.09.2026: erppark.ru проксируется сюда), поэтому
; доверяем заголовкам X-Forwarded-*. Без этого Odoo считает схемой http и
; собирает ссылки в письмах и редиректах с http://, хотя снаружи https.
; Включать ТОЛЬКО когда перед Odoo действительно стоит доверенный прокси:
; при прямом доступе на порт заголовки может подделать кто угодно.
proxy_mode = True

log_level = info
