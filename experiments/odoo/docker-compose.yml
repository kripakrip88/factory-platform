# Odoo 19 Community + RuOdoo — ИЗОЛИРОВАННЫЙ ЭКСПЕРИМЕНТ. Не часть основного стека.
# Ничего не делит с erp / erp-staging / infra / wem / carbon: свой проект, сеть, тома.
#
# Запуск: см. install.sh
# Смотреть: https://erppark.ru (nginx → host.docker.internal:8084). Порт 8084 снаружи
# закрыт (08.10.2026): привязан к docker0 172.17.0.1, как 8085.

name: odoo

services:
  db:
    image: postgres:16-alpine
    container_name: odoo-db
    restart: unless-stopped
    # Портов наружу НЕТ
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:?не задан ODOO_DB_USER}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?не задан ODOO_DB_PASSWORD}
      # Odoo сам создаёт базы, поэтому пользователь должен уметь CREATEDB
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=60
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m

  odoo:
    # Свой образ = официальный Odoo + Python-зависимости RuOdoo (см. Dockerfile).
    # Без них модули локализации не ставятся: проверено, падает на docxcompose.
    # Базовый тег с датой, а не плавающий 19.0 — иначе перезапуск может тихо
    # сменить версию (прецедент с frappe/erpnext, см. CLAUDE.md «Версии»).
    build:
      context: .
    image: odoo-ru:19.0-20261006
    container_name: odoo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Основной порт. 8080/8081/8082/8083 уже заняты.
      # Только для nginx (host.docker.internal = 172.17.0.1), не в интернет:
      # Docker публикует порты мимо ufw, на 0.0.0.0 пароль шёл бы открытым
      # текстом, а X-Forwarded-For подделывался бы (обход защиты от подбора).
      - "172.17.0.1:8084:8069"
      # Канал живых обновлений (websocket): чат, уведомления, «в сети».
      # При workers > 0 Odoo обслуживает /websocket ТОЛЬКО отдельным процессом
      # gevent на 8072, а обычный порт отвечает на него ошибкой 500 «Couldn't
      # bind the websocket» — 90 раз за полчаса (замер 29.09.2026), отсюда
      # «Не в сети» в углу и уведомления только после перезагрузки страницы.
      #
      # Привязан к адресу docker0 (172.17.0.1), а не ко всем адресам: снаружи
      # этот порт не нужен, туда ходит только infra-nginx через
      # host.docker.internal (= host-gateway = 172.17.0.1). ufw тут не защита —
      # опубликованные порты Docker идут в обход него.
      - "172.17.0.1:8085:8072"
    environment:
      HOST: db
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      # RuOdoo подключается как дополнительный каталог модулей, только на чтение —
      # чтобы эксперимент не мог испортить исходники локализации
      - ${RUODOO_SRC:?не задан RUODOO_SRC}:/mnt/extra-addons:ro
      # Сторонние модули (темы и прочее) — отдельным каталогом, чтобы не мешать
      # их с локализацией: у RuOdoo свой цикл обновления через git pull.
      - ${EXTRA_ADDONS:-/opt/experiments/odoo/addons-extra}:/mnt/third-party:ro
    # Считать в паре с limit_memory_* в odoo.conf: процессов с лимитом три
    # (2 http + 1 cron), плюс мастер и gevent. Поднято с 2 ГБ до 2,5 ГБ вместе
    # с лимитами воркеров — иначе поднятый лимит воркера обменял бы аккуратный
    # перезапуск на настоящий OOM. На сервере 11 ГБ и 7,4 ГБ свободно (замер
    # 21.09.2026), боевой ERPNext эти полгигабайта не заметит.
    mem_limit: 2.5g
    cpus: 2.0

volumes:
  odoo_db_data:
  odoo_data:
