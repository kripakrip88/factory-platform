# Общий вход сервера pmk-main (45.153.188.84, с 15.11.2026): один nginx на 80/443 для всех систем
# на сервере — Odoo (erppark.ru), сайт (pmkpark.ru), 1С (веб-публикация). Каждая система живёт своим
# docker-проектом и слушает только 172.17.0.1 (docker0) — наружу её порты не торчат: Docker
# публикует порты мимо ufw. Сюда приходят все запросы, отсюда — по server_name к нужной системе.
#
# Развернуть / обновить:  sh /opt/factory-platform/infra/edge/edge.sh up
# Сертификат и включение сайта:  sh .../edge.sh cert erppark.ru www.erppark.ru
name: edge

services:
  nginx:
    image: nginx:1.27.5-alpine
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/auth:/etc/nginx/auth:ro        # пароли ворот (1С) — вне git, infra/1c/gate-1c.sh
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

volumes:
  certbot_conf:
  certbot_www:
