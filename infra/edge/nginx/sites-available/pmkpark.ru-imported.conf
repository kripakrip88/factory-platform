# pmkpark.ru — ВРЕМЕННО, на переезд с 141.133.188.220 (16.11.2026): сертификат Let's Encrypt, скопированный со
# старого сервера (/etc/letsencrypt/imported/pmkpark.ru/ в томе edge_certbot_conf). Нужен, чтобы в момент
# переключения DNS сайт сразу отвечал по HTTPS. После переключения: edge.sh cert pmkpark.ru www.pmkpark.ru,
# затем удалить этот файл из /opt/edge/nginx/sites (рабочий — pmkpark.ru.conf с live/).
server {
    listen 443 ssl;
    http2 on;
    server_name pmkpark.ru www.pmkpark.ru;
    ssl_certificate     /etc/letsencrypt/imported/pmkpark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/imported/pmkpark.ru/privkey.pem;
    location / { proxy_pass http://host.docker.internal:8090; }
}
