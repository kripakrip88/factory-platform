# Сайт pmkpark.ru (Битрикс) — ЗАГОТОВКА. Стек сайта — /opt/site (свой docker-проект: nginx+php-fpm
# +MySQL), слушает 172.17.0.1:8090. Включать после переноса сайта: edge.sh cert pmkpark.ru www.pmkpark.ru
server {
    listen 443 ssl;
    http2 on;
    server_name pmkpark.ru www.pmkpark.ru;
    ssl_certificate     /etc/letsencrypt/live/pmkpark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pmkpark.ru/privkey.pem;
    location / { proxy_pass http://host.docker.internal:8090; }
}
