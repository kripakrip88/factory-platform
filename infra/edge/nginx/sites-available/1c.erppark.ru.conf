# 1С (веб-клиент и HTTP-сервисы) — ЗАГОТОВКА. Стек — /opt/1c: сервер 1С + PostgreSQL для 1С +
# Apache с веб-публикацией на 172.17.0.1:8091. Порты кластера 1С (1540/1541/1560-1591) наружу НЕ
# открываются: тонкий клиент ходит через веб-публикацию по HTTPS. Включать: edge.sh cert 1c.erppark.ru
server {
    listen 443 ssl;
    http2 on;
    server_name 1c.erppark.ru;
    ssl_certificate     /etc/letsencrypt/live/1c.erppark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1c.erppark.ru/privkey.pem;
    client_max_body_size 500m;
    proxy_read_timeout 1800s;
    location / { proxy_pass http://host.docker.internal:8091; }
}
