# 1С — веб-клиент (16.11.2026). Apache с веб-публикацией 1С живёт на хосте: 172.17.0.1:8091 (infra/1c).
# Порты кластера 1С (1540+) наружу НЕ открыты: всё идёт через HTTPS.
#
# ВТОРОЙ ПАРОЛЬ ПЕРЕД 1С (Антон 16.11.2026): «давай сделаем второй пароль перед 1с».
#   Вход в 1С: https://1c.erppark.ru → /_vhod/ спрашивает логин и пароль ворот (окно браузера) → ставит
#   на 30 дней куку pmk1c → дальше обычный вход 1С своим пользователем и паролем.
#   Почему кука, а не basic auth на весь сайт: 1С сама умеет входить по заголовку Authorization —
#   два пароля в одном заголовке спорили бы. Поэтому пароль ворот проверяется только на /_vhod/,
#   а сам заголовок ворот до 1С не доходит (map $pmk1c_auth).
#   Пароль, кука и заголовок — в /opt/edge/nginx/auth/ (вне git, в зашифрованных секретах бакета).
#   Сменить пароль (старые куки перестанут действовать): bash /opt/factory-platform/infra/1c/gate-1c.sh
#   Тонкий клиент через ворота не пройдёт — только браузер. Понадобится тонкий — обсудить отдельно.
include /etc/nginx/auth/1c-gate.conf;   # map $pmk1c_ok, $pmk1c_token, $pmk1c_auth; limit_req_zone pmk1c_gate

server {
    listen 443 ssl;
    http2 on;
    server_name 1c.erppark.ru;
    ssl_certificate     /etc/letsencrypt/live/1c.erppark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1c.erppark.ru/privkey.pem;
    client_max_body_size 500m;
    proxy_read_timeout 1800s;

    # Ворота: пароль браузера → кука на 30 дней → в 1С.
    # try_files, а не return: return срабатывает ДО проверки пароля (фаза rewrite раньше access).
    location = /_vhod/ {
        limit_req zone=pmk1c_gate burst=5 nodelay;
        auth_basic "PMK 1C";
        auth_basic_user_file /etc/nginx/auth/1c.htpasswd;
        root /var/empty;
        try_files /nonexistent @pmk1c_pass;
    }
    location @pmk1c_pass {
        add_header Set-Cookie "pmk1c=$pmk1c_token; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /buh/;
    }

    location / {
        if ($pmk1c_ok = 0) { return 302 /_vhod/; }
        # своя proxy_set_header в location отменяет общие из nginx.conf — повторить их здесь
        proxy_set_header Authorization $pmk1c_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://host.docker.internal:8091;
    }
}
