# Odoo (боевой): erppark.ru → 172.17.0.1:8084, канал живых обновлений /websocket → :8085
# (процесс gevent при workers > 0; без него «Не в сети», см. experiments/odoo/docker-compose.yml).
# Odoo знает про прокси: proxy_mode = True в experiments/odoo/odoo.conf.
server {
    listen 443 ssl;
    http2 on;
    server_name erppark.ru;
    ssl_certificate     /etc/letsencrypt/live/erppark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erppark.ru/privkey.pem;

    location /websocket {
        proxy_pass http://host.docker.internal:8085;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { proxy_pass http://host.docker.internal:8084; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.erppark.ru;
    ssl_certificate     /etc/letsencrypt/live/erppark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erppark.ru/privkey.pem;
    return 301 https://erppark.ru$request_uri;
}
