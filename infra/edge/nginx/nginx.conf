# Общий вход pmk-main. Сайты — файлы в sites/ (включает edge.sh, когда у домена есть сертификат),
# заготовки — sites-available/. Глобальные настройки перенесены из infra/nginx/nginx.conf старого
# сервера (сжатие ×5 для бандлов Odoo, вебсокеты, заголовки прокси) — комментарии с замерами там.
worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    server_tokens off;

    log_format edge '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log edge;

    map_hash_bucket_size 128;   # ключи map ворот 1С (кука 48 знаков, заголовок Basic) не влезают в 64

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/xml+rss image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # :80 — ACME-челлендж, проверка живости, остальное на HTTPS.
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location = /health { return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    # :443 без подходящего сайта — закрыть соединение (не светить чужой сертификат).
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    include /etc/nginx/sites/*.conf;
}
