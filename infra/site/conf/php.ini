; Как на старом сервере (/etc/php/8.3/apache2/php.ini + ISPmanager), 16.11.2026
short_open_tag = On          ; Битрикс пишет <? — без этого файлы отдаются текстом
memory_limit = 256M
max_execution_time = 30
max_input_vars = 10000       ; админка Битрикса (свойства инфоблоков) упирается в 1000
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = Europe/Moscow
display_errors = Off
log_errors = On
realpath_cache_size = 4096K
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 100000
opcache.revalidate_freq = 2
opcache.jit = off
; база — сокетом, как «localhost» на старом сервере: файлы сайта переносятся без правок
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
; письма mail() — через msmtp (основная почта форм идёт модулем wsrubi.smtp напрямую по SMTP)
sendmail_path = "/usr/bin/msmtp -t -i"
