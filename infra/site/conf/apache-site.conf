# За общим nginx (infra/edge): TLS снимает он, сюда приходит http на 172.17.0.1:8090.
RemoteIPHeader X-Real-IP
RemoteIPTrustedProxy 172.16.0.0/12
# Битрикс и .htaccess смотрят на HTTPS — без этого вечный редирект на https
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
<VirtualHost *:80>
    ServerName pmkpark.ru
    ServerAlias www.pmkpark.ru
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log "%a %t \"%r\" %>s %b %D"
</VirtualHost>
