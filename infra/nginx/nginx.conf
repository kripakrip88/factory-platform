events {
    worker_connections 1024;
}

http {
    # ── ФАЗА B: TLS включён. Один SAN-серт Let's Encrypt на все 4 хоста ──────────
    #   /etc/letsencrypt/live/erppark.ru/{fullchain,privkey}.pem
    #   (том certbot_conf смонтирован в nginx :ro; продление — сервис certbot).

    upstream n8n_up { server n8n:5678; }

    # Корректный апгрейд вебсокетов (редактор n8n, realtime Frappe).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 50m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_certificate     /etc/letsencrypt/live/erppark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erppark.ru/privkey.pem;

    # ── :80 — ACME-челлендж + редирект всего остального на HTTPS ────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location /health { return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── ПРОД ERP: https://erppark.ru → :8080 ───────────────────────────────────
    server {
        listen 443 ssl;
        server_name erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8080; }
    }

    # ── www → apex (301) ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name www.erppark.ru;
        return 301 https://erppark.ru$request_uri;
    }

    # ── STAGING ERP: https://d.erppark.ru → :8081 ──────────────────────────────
    server {
        listen 443 ssl;
        server_name d.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8081; }
    }

    # ── n8n: https://n8n.erppark.ru → n8n:5678 ─────────────────────────────────
    server {
        listen 443 ssl;
        server_name n8n.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://n8n_up; }
    }
}
