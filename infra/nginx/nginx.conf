events {
    worker_connections 1024;
}

http {
    # ── TLS: один SAN-серт Let's Encrypt на все 4 хоста ─────────────────────────
    #   /etc/letsencrypt/live/erppark.ru/{fullchain,privkey}.pem (том certbot_conf).

    # Docker embedded DNS — для РАНТАЙМ-резолва n8n (его IP меняется при пересоздании
    # контейнера; статичный upstream кэшировал бы старый IP → 502). Заодно снимает
    # parse-time резолв в nginx -t.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Корректный апгрейд вебсокетов (редактор n8n, realtime Frappe).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 50m;

    # ── Сжатие ─────────────────────────────────────────────────────────────────
    # Odoo отдаёт бандлы СЫРЫМИ: измерено 21.09.2026 — 7,4 МБ javascript и два
    # css по 1,3 МБ, итого 9,99 МБ на холодную загрузку, и ни одного заголовка
    # Content-Encoding в ответе. Сжатые на сервере те же файлы дали 1,96 МБ —
    # ровно в 5,1 раза меньше. Сам Odoo сжимать не умеет, это работа прокси.
    #
    # `gzip_proxied any` обязателен: ответы приходят с backend, а без этой
    # строки nginx их не жмёт. Уровень 5 — середина: дальше растёт процессор,
    # а выигрыш в байтах уже копеечный.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_certificate     /etc/letsencrypt/live/erppark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erppark.ru/privkey.pem;

    # ── :80 — ACME-челлендж + редирект всего остального на HTTPS ────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location /health { return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── https://erppark.ru → Odoo :8084 ────────────────────────────────────────
    #
    # 21.09.2026 боевой адрес переведён с ERPNext (:8080) на Odoo по решению
    # владельца: в ERPNext за трое суток было 19 обращений и ни одного входа,
    # пользуется им он один. Контейнеры ERPNext остановлены, тома целы —
    # вернуть адрес значит поменять 8084 обратно на 8080 и поднять стек.
    #
    # Odoo при этом обязан знать, что стоит за прокси: proxy_mode = True в
    # experiments/odoo/odoo.conf. Без него он соберёт ссылки в письмах с http://.
    server {
        listen 443 ssl;
        server_name erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8084; }
    }

    # ── www → apex (301) ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name www.erppark.ru;
        return 301 https://erppark.ru$request_uri;
    }

    # ── STAGING ERP: https://d.erppark.ru → :8081 ──────────────────────────────
    server {
        listen 443 ssl;
        server_name d.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8081; }
    }

    # ── n8n: https://n8n.erppark.ru → n8n:5678 (переменная → рантайм-резолв) ────
    server {
        listen 443 ssl;
        server_name n8n.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
            set $n8n_backend http://n8n:5678;
            proxy_pass $n8n_backend;
        }
    }

    # ── Carbon (эксперимент, оценка) ───────────────────────────────────────────
    # Все три имени идут на ОДИН порт 8083 — там Caddy из стека Carbon, он сам
    # разводит по заголовку Host на erp:3000 / mes:3000 / kong:8000.
    # Host и X-Forwarded-Proto проставлены глобально выше — Caddy на них и опирается
    # (у него в Caddyfile trusted_proxies private_ranges).
    # Свой ACME у Caddy выключён (хосты в его .env с префиксом http://), 80/443
    # остаются за этим nginx.
    server {
        listen 443 ssl;
        server_name carbon.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8083; }
    }

    server {
        listen 443 ssl;
        server_name mes.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8083; }
    }

    # Шлюз Supabase: сюда браузер ходит напрямую (авторизация, данные, файлы,
    # realtime по вебсокетам — апгрейд проставлен глобально).
    server {
        listen 443 ssl;
        server_name api.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass http://host.docker.internal:8083; }
    }
}
