events {
    worker_connections 1024;
}

http {
    # ── ФАЗА A (текущая): HTTP + ACME-челлендж, БЕЗ TLS ─────────────────────────
    # Никаких ssl_certificate — nginx стартует гарантированно, n8n/ERP не падают.
    # TLS (443 + редирект 80→443 + host_name/n8n env) включаются Фазой B ПОСЛЕ
    # выпуска сертов (см. infra/README-domains.md, scripts/issue-certs.sh).

    upstream n8n_up { server n8n:5678; }

    # Корректный апгрейд вебсокетов (редактор n8n, realtime Frappe):
    # Connection: upgrade только когда клиент прислал Upgrade, иначе close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ERP prod/staging живут в отдельных docker-compose проектах (erp / erp-staging),
    # публикуют порты на хост. Достаём их через host-gateway (extra_hosts в compose):
    # prod → :8080, staging → :8081.

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 50m;

    # ── Дефолт: health + n8n по старому пути /n8n/ (сохраняем на переходный период) ─
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /n8n/ {
            proxy_pass http://n8n_up/;
        }
    }

    # ── ПРОД ERP: erppark.ru (+ www) → :8080 ───────────────────────────────────
    server {
        listen 80;
        server_name erppark.ru www.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / {
            proxy_pass http://host.docker.internal:8080;
        }
    }

    # ── STAGING ERP: d.erppark.ru → :8081 ──────────────────────────────────────
    server {
        listen 80;
        server_name d.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / {
            proxy_pass http://host.docker.internal:8081;
        }
    }

    # ── n8n: n8n.erppark.ru → n8n:5678 ─────────────────────────────────────────
    server {
        listen 80;
        server_name n8n.erppark.ru;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / {
            proxy_pass http://n8n_up;
        }
    }
}
