# ─────────────────────────────────────────────────────────────────────────────
# STAGING-стек ERPNext. Поднимать ТОЛЬКО с именем проекта erp-staging:
#   docker compose -p erp-staging -f services/erp/docker-compose.staging.yml up -d
#
# Отличия от прод (services/erp/docker-compose.yml):
#   - frontend на порту 8081 (прод 8080);
#   - том assets — обычный (НЕ external erp_assets) → станет erp-staging_assets;
#   - имя проекта erp-staging → все тома/контейнеры с префиксом erp-staging_*,
#     полностью изолированы от прод (erp_*).
# ⚠️ Почта: после клона данных боевой Email Account (pmkpark@mail.ru) в staging
#   ОБЯЗАТЕЛЬНО выключается (enable_incoming/outgoing=0) до запуска scheduler/queue,
#   иначе два инстанса полезут в один ящик. См. scripts/clone-prod-to-staging.sh.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ─── MariaDB ────────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis (cache + queue + socketio) ───────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - redis_cache:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - redis_queue:/data

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - redis_socketio:/data

  # ─── ERPNext backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: sh -c "python3 /home/frappe/fix_assets.py && start.sh"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - REDIS_SOCKETIO=redis-socketio:6379
      - SOCKETIO_PORT=9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend (nginx static) ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: nginx-entrypoint.sh
    environment:
      - BACKEND=backend:8000
      - SOCKETIO=websocket:9000
      - FRAPPE_SITE_NAME_HEADER=erp.localhost
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
    ports:
      - "8081:8080"
    depends_on:
      - backend
      - websocket

  # ─── Websocket ───────────────────────────────────────────────────────────────
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      - REDIS_SOCKETIO=redis-socketio:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - redis-socketio

  # ─── Workers ─────────────────────────────────────────────────────────────────
  queue-short:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: bench worker --queue short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-queue

  queue-long:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: bench worker --queue long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-queue

  queue-default:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: bench worker --queue default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-queue

  # ─── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_CRM: crm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-queue

volumes:
  db_data:
  redis_cache:
  redis_queue:
  redis_socketio:
  sites:
  assets:
  logs:
