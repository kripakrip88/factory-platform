[project]
name = "metal_calculator"
authors = [
    { name = "Factory Platform", email = "kripakrip88@gmail.com" }
]
description = "Калькулятор веса металлопроката (конструкционная сталь) — вес строго из справочников ГОСТ. Изолированная frappe-аппа внутри ERPNext."
license = { text = "Proprietary" }
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # ставится и управляется через bench
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191", "UP030", "UP031", "UP032", "UP037", "UP040",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
