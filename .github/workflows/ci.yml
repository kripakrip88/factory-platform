name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-telegram-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/telegram-bot/package-lock.json
      - run: npm ci
      - run: npm run build
