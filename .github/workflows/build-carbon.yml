name: Build Carbon images

# Собирает образы Carbon (crbnos/carbon) ЗДЕСЬ, а не на VPS.
#
# Почему не на сервере: в их Dockerfile прописано ARG NODE_OPTIONS
# "--max-old-space-size=8024", т.е. сборке нужно 8 ГБ heap. На нашем VPS 11 ГБ
# всего и рядом работает боевой ERPNext — в июле 2026 ровно такая сборка (Frappe CRM)
# дала load 185 и положила прод. Раннер GitHub даёт 16 ГБ и ничего боевого не трогает.
#
# Образы ПРИВАТНЫЕ и такими должны остаться: Dockerfile копирует packages целиком,
# включая packages/ee, который по их лицензии требует коммерческой лицензии.
# Публиковать их = распространять ee-код. Не делать публичными.
#
# Запуск: вкладка Actions → Build Carbon images → Run workflow.

on:
  # workflow_dispatch виден в UI только когда файл есть в ветке по умолчанию (main),
  # а мерж в main — только по явному ОК Антона (CLAUDE.md, правило 5). Поэтому
  # сборку запускаем пушем в саму ветку эксперимента; фильтр paths — чтобы обычные
  # коммиты в ветку не гоняли 40-минутную сборку.
  push:
    branches: [feature/experiment-carbon]
    paths: [".github/workflows/build-carbon.yml"]
  workflow_dispatch:
    inputs:
      carbon_ref:
        description: "Коммит/тег/ветка crbnos/carbon (пин — не 'main', чтобы сборка была воспроизводимой)"
        required: true
        default: "7daffaaba2ec6196a0af9f76b22c188b05c67a00"
      push_to_server:
        description: "Загрузить образы на сервер после сборки"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-carbon
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM: linux/amd64
  # При push-триггере inputs пустые → нужен фолбэк на тот же пиннутый коммит
  CARBON_REF: ${{ inputs.carbon_ref || '7daffaaba2ec6196a0af9f76b22c188b05c67a00' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      erp: ${{ steps.names.outputs.erp }}
      mes: ${{ steps.names.outputs.mes }}
      ops: ${{ steps.names.outputs.ops }}

    steps:
      - name: Освободить место на раннере
        # Три образа + pnpm store + node_modules не влезают в дефолтные ~14 ГБ.
        run: |
          echo "До:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "После:"; df -h / | tail -1

      - name: Имена образов
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha_short=$(echo "${{ env.CARBON_REF }}" | cut -c1-12)
          {
            echo "erp=${{ env.REGISTRY }}/$owner/carbon-erp"
            echo "mes=${{ env.REGISTRY }}/$owner/carbon-mes"
            echo "ops=${{ env.REGISTRY }}/$owner/carbon-ops"
            echo "tag=$sha_short"
          } >> "$GITHUB_OUTPUT"

      - name: Забрать исходники Carbon (пиннутый ref)
        uses: actions/checkout@v4
        with:
          repository: crbnos/carbon
          ref: ${{ env.CARBON_REF }}
          path: carbon

      - name: Зафиксировать, что именно собираем
        working-directory: carbon
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "date:   $(git log -1 --format=%cI)"
          echo "subject:$(git log -1 --format=%s)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Три образа одним джобом и одним билдером: стадия `deps` (pnpm install)
      # собирается ОДИН раз и переиспользуется остальными из локального кэша слоёв.
      # Матрица так не умеет — каждый джоб ставил бы зависимости заново.

      - name: Образ ERP (стадия runner)
        uses: docker/build-push-action@v6
        with:
          context: carbon
          build-args: APP=erp
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.names.outputs.erp }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.erp }}:latest
          cache-from: type=gha,scope=carbon
          cache-to: type=gha,scope=carbon,mode=max
          # Swarm с --resolve-image always ожидает обычный манифест, не индекс
          provenance: false
          sbom: false

      - name: Образ MES (стадия runner)
        uses: docker/build-push-action@v6
        with:
          context: carbon
          build-args: APP=mes
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.names.outputs.mes }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.mes }}:latest
          cache-from: type=gha,scope=carbon
          cache-to: type=gha,scope=carbon,mode=max
          provenance: false
          sbom: false

      - name: Образ OPS (стадия ops — миграции)
        # Нужен отдельно: стадия `pruned`, из которой собран runner, ВЫРЕЗАЕТ
        # supabase CLI (`-name 'supabase@*'`), а их deploy.sh гоняет
        # `pnpm exec supabase migration up` из ERP-образа. Стадия `ops` заведена
        # в их Dockerfile ровно для migrate/seed и CLI сохраняет.
        uses: docker/build-push-action@v6
        with:
          context: carbon
          target: ops
          build-args: APP=erp
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.names.outputs.ops }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.ops }}:latest
          cache-from: type=gha,scope=carbon
          cache-to: type=gha,scope=carbon,mode=max
          provenance: false
          sbom: false

      - name: ПРОВЕРКА — есть ли supabase CLI в образах
        # Эмпирически закрываем расхождение в их репозитории: в runner CLI должен
        # отсутствовать, в ops — присутствовать. Если окажется наоборот, ops не нужен.
        run: |
          set +e
          echo "── ERP (ожидаем: CLI НЕТ)"
          docker run --rm --entrypoint sh "${{ steps.names.outputs.erp }}:${{ steps.names.outputs.tag }}" \
            -c 'cd /repo/packages/database && pnpm exec supabase --version 2>&1 | tail -3'
          echo "   код возврата: $?"
          echo "── OPS (ожидаем: CLI ЕСТЬ)"
          docker run --rm --entrypoint sh "${{ steps.names.outputs.ops }}:${{ steps.names.outputs.tag }}" \
            -c 'cd /repo/packages/database && pnpm exec supabase --version 2>&1 | tail -3'
          echo "   код возврата: $?"

      - name: Размеры образов
        run: |
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' \
            | grep -E 'carbon-(erp|mes|ops)' | sort -u

      - name: Загрузить образы на сервер
        # При push-триггере inputs пустые — грузим по умолчанию
        if: ${{ github.event_name == 'push' || inputs.push_to_server }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER,IMG_ERP,IMG_MES,IMG_OPS,IMG_TAG
          script: |
            set -e
            # Логин ЭФЕМЕРНЫМ токеном этого запуска — на сервере не остаётся
            # долгоживущих кредов, и Антону не нужно заводить PAT.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            for img in "$IMG_ERP" "$IMG_MES" "$IMG_OPS"; do
              echo "── pull $img:$IMG_TAG"
              docker pull "$img:$IMG_TAG"
              docker tag  "$img:$IMG_TAG" "$img:latest"
            done
            docker logout ghcr.io
            echo "── загружено:"
            docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' | grep carbon- | sort -u
            df -h / | tail -1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMG_ERP: ${{ steps.names.outputs.erp }}
          IMG_MES: ${{ steps.names.outputs.mes }}
          IMG_OPS: ${{ steps.names.outputs.ops }}
          IMG_TAG: ${{ steps.names.outputs.tag }}
