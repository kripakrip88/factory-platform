name: Deploy AI Assistant

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/ai-assistant/**'
      - 'infra/docker-compose*.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/factory-platform
            git pull origin ${{ github.ref_name }}
            docker compose -f infra/docker-compose.yml build ai-assistant
            docker compose -f infra/docker-compose.yml up -d ai-assistant
            docker compose -f infra/docker-compose.yml exec -T ai-assistant wget -qO- http://localhost:3001/health || exit 1
