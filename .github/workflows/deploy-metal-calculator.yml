name: Activate metal_calculator

# Активация (install-app) калькулятора металла на боевом сайте — ТОЛЬКО вручную.
# Никогда не запускается автоматически. Предусловие: код metal_calculator уже
# в образе (т.е. обычный деплой services/erp прошёл и контейнеры пересобраны).
#
# Пути отхода:
#  - бэкап БД + файлов ДО установки (нет бэкапа → abort);
#  - при сбое install-app/migrate — авто-откат: uninstall-app + clear-cache,
#    ERP возвращается в состояние до установки;
#  - смок-проверка: ERP отвечает и страница калькулятора доступна.

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Activate via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            B="cd /home/frappe/frappe-bench && bench --site erp.localhost"

            echo "🔎 Предусловие: код metal_calculator есть в образе?"
            if ! docker exec erp-backend-1 bash -c "test -d /home/frappe/frappe-bench/apps/metal_calculator"; then
              echo "❌ ABORT: apps/metal_calculator не найден в контейнере."
              echo "   Сначала задеплой services/erp (rebuild), потом запускай активацию."
              exit 1
            fi

            echo "🔒 ПУТЬ ОТХОДА: бэкап БД + файлов до установки..."
            docker exec erp-backend-1 bash -c "$B backup --with-files" \
              || { echo '❌ ABORT: бэкап не удался — ничего не ставим'; exit 1; }
            echo "✅ Бэкап создан (sites/erp.localhost/private/backups)"

            if docker exec erp-backend-1 bash -c "$B list-apps" | grep -qw metal_calculator; then
              echo "ℹ️ metal_calculator уже установлен — догоняем миграции/сид (идемпотентно)"
              docker exec erp-backend-1 bash -c "$B migrate"
            else
              echo "📦 install-app metal_calculator..."
              if ! docker exec erp-backend-1 bash -c "$B install-app metal_calculator"; then
                echo "⚠️ install-app упал → АВТО-ОТКАТ, чтобы не сломать ERP"
                docker exec erp-backend-1 bash -c "$B uninstall-app metal_calculator --yes --no-backup" || true
                docker exec erp-backend-1 bash -c "$B clear-cache" || true
                docker exec erp-redis-cache-1 redis-cli FLUSHALL || true
                echo "↩️ Откат выполнен. ERP в состоянии до установки."
                exit 1
              fi
            fi

            echo "🔨 Сборка ассетов аппы..."
            docker exec erp-backend-1 bash -c "cd /home/frappe/frappe-bench && bench build --app metal_calculator" || true
            echo "🧹 Сброс кэша..."
            docker exec erp-backend-1 bash -c "$B clear-cache" || true
            docker exec erp-redis-cache-1 redis-cli FLUSHALL || true

            echo "🔍 Смок: ERP жив и калькулятор доступен?"
            ROOT=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
            PAGE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/app/metal_calculator)
            echo "erp root http=$ROOT | calculator page http=$PAGE"
            if [ "$ROOT" != "200" ] && [ "$ROOT" != "302" ]; then
              echo "❌ ERP не отвечает корректно после установки (root=$ROOT) — проверь логи!"
              echo "   Ручной откат: docker exec erp-backend-1 bash -c \"$B uninstall-app metal_calculator --yes --no-backup\""
              exit 1
            fi
            echo "✅ metal_calculator активирован. Воркспейс «Калькуляторы» должен появиться (Ctrl+Shift+R)."
