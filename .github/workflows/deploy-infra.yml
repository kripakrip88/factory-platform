name: Deploy Infra

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/factory-platform

            # fetch + reset --hard (как в deploy-erp): устойчиво к расхождению
            # локального develop с origin. Прежний `git pull` падал на divergent
            # branches и тихо оставлял старый код (Фаза A не применялась).
            git fetch origin ${{ github.ref_name }}
            git checkout -f ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            grep -q '^N8N_SECURE_COOKIE=' .env || echo 'N8N_SECURE_COOKIE=false' >> .env
            docker compose -f infra/docker-compose.yml --env-file .env up -d --no-build
            sleep 5

            # Выпуск/обновление Let's Encrypt сертов (идемпотентно, НЕ фейлит деплой).
            # Требует: nginx уже отдаёт /.well-known/acme-challenge/ (Фаза A) и DNS
            # доменов резолвится на этот сервер. При проблеме — просто предупреждение,
            # nginx продолжает работать по HTTP, серты выпустим повторным запуском.
            if [ -f infra/scripts/issue-certs.sh ]; then
              bash infra/scripts/issue-certs.sh \
                || echo "⚠️ issue-certs не прошёл (нефатально) — проверь DNS/ACME, повтори деплой/dispatch"
            fi

            curl -f http://localhost/health || exit 1
