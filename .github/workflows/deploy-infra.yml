name: Deploy Infra

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/factory-platform

            # fetch + reset --hard (как в deploy-erp): устойчиво к расхождению
            # локального develop с origin. Прежний `git pull` падал на divergent
            # branches и тихо оставлял старый код (Фаза A не применялась).
            git fetch origin ${{ github.ref_name }}
            git checkout -f ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            grep -q '^N8N_SECURE_COOKIE=' .env || echo 'N8N_SECURE_COOKIE=false' >> .env
            # Общий up. telegram-bot без собранного образа (--no-build) может падать
            # и прерывать up ДО пересоздания nginx — поэтому не блокируем (|| true)…
            docker compose -f infra/docker-compose.yml --env-file .env up -d --no-build \
              || echo "⚠️ up -d частично (напр. telegram-bot без образа) — продолжаем"
            # ГЕЙТ: валидируем новый nginx.conf (с сертами) в одноразовом контейнере
            # ДО пересоздания живого nginx — битый конфиг не должен уронить n8n/прод.
            VOLC=$(docker volume ls --format '{{.Name}}' | grep -E 'certbot_conf$' | head -1 || true)
            VOLW=$(docker volume ls --format '{{.Name}}' | grep -E 'certbot_www$' | head -1 || true)
            # n8n резолвится в рантайме (переменный proxy_pass), поэтому -t его не
            # трогает. Нужно лишь чтобы резолвился host.docker.internal (ERP-апстримы,
            # статичный proxy_pass) — даём его в /etc/hosts (значение для -t неважно).
            docker run --rm \
              --add-host host.docker.internal:127.0.0.1 \
              -v "$(pwd)/infra/nginx/nginx.conf":/etc/nginx/nginx.conf:ro \
              ${VOLC:+-v $VOLC:/etc/letsencrypt:ro} \
              ${VOLW:+-v $VOLW:/var/www/certbot:ro} \
              nginx:alpine nginx -t \
              || { echo "❌ nginx -t FAILED — конфиг битый, живой nginx НЕ трогаем (n8n/прод целы)"; exit 1; }

            # …и ЯВНО форс-пересоздаём nginx, чтобы он гарантированно подхватил
            # актуальный nginx.conf (иначе serve старый конфиг → ACME 404 → серты не выпустятся).
            docker compose -f infra/docker-compose.yml --env-file .env up -d --no-build --force-recreate nginx
            sleep 5

            # Выпуск/обновление Let's Encrypt сертов (идемпотентно, НЕ фейлит деплой).
            # Требует: nginx уже отдаёт /.well-known/acme-challenge/ (Фаза A) и DNS
            # доменов резолвится на этот сервер. При проблеме — просто предупреждение,
            # nginx продолжает работать по HTTP, серты выпустим повторным запуском.
            if [ -f infra/scripts/issue-certs.sh ]; then
              bash infra/scripts/issue-certs.sh \
                || echo "⚠️ issue-certs не прошёл (нефатально) — проверь DNS/ACME, повтори деплой/dispatch"
            fi

            curl -f http://localhost/health || exit 1
