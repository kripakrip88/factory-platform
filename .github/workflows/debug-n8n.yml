name: Debug n8n

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== n8n container status ==="
            docker ps --filter name=n8n --format "{{.Names}} {{.Status}}"

            echo "=== N8N_SECURE_COOKIE in container ==="
            docker inspect $(docker ps -qf name=n8n) --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -i secure || echo "NOT FOUND"

            echo "=== .env N8N_SECURE_COOKIE ==="
            grep -i N8N_SECURE .env || echo "NOT IN .env"

            echo "=== n8n logs last 20 lines ==="
            docker logs --tail 20 $(docker ps -qf name=n8n)
