name: Deploy Second Brain

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "services/second-brain/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/factory-platform

            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            cd services/second-brain

            docker compose pull brain-db brain-redis brain-n8n 2>/dev/null || true
            docker compose up -d --build brain-bot
            sleep 5
            docker compose exec -T brain-db psql -U "${POSTGRES_USER:-brain}" -d "${POSTGRES_DB:-brain}" \
              -c "ALTER TABLE brain.items ADD COLUMN IF NOT EXISTS user_rating SMALLINT DEFAULT NULL;" || true
            docker compose logs brain-bot --tail 30
            docker compose ps
