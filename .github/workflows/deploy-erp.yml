name: Deploy ERP

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/erp/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/factory-platform

            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            echo "🔨 Сборка образа с saas_theme..."
            docker compose -f services/erp/docker-compose.yml build --no-cache

            echo "🔄 Перезапуск контейнеров..."
            docker compose -f services/erp/docker-compose.yml up -d

            echo "⏳ Ожидание готовности backend (60 сек)..."
            sleep 60

            echo "✅ ERP обновлён"
