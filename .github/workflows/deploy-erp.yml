name: Deploy ERP

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/erp/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/factory-platform

            # fetch + reset --hard вместо pull: на сервере локальная ветка может
            # разойтись (старые деплои оставляли локальные коммиты) → git pull падал
            # с "divergent branches". reset --hard всегда приводит к origin.
            git fetch origin ${{ github.ref_name }}
            git checkout -f ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "🔨 Сборка образа с saas_theme..."
            docker compose -f services/erp/docker-compose.yml build --no-cache

            echo "🔄 Перезапуск контейнеров..."
            docker compose -f services/erp/docker-compose.yml up -d --force-recreate

            echo "⏳ Ожидание готовности backend (60 сек)..."
            sleep 60

            echo "🗄️ Миграция схемы БД (патчи apps)..."
            docker exec erp-backend-1 bash -c "cd /home/frappe/frappe-bench && bench --site erp.localhost migrate"

            echo "🧹 Сброс кэша Frappe (boot info)..."
            docker exec erp-backend-1 bash -c "cd /home/frappe/frappe-bench && bench --site erp.localhost clear-cache" || true

            # Флаш redis-кэша: при сборке образа Redis недоступен, поэтому кэш
            # assets_json остаётся со СТАРЫМИ хэшами бандлов → boot ссылается на
            # несуществующие desk.bundle.<hash>.css (404, ломается вся стилизация
            # форм). Флаш заставляет frappe перечитать assets.json с актуальными
            # хэшами. redis_cache — чистый кэш, флашить безопасно.
            echo "🧹 Флаш redis_cache (устранить устаревший assets_json)..."
            docker exec erp-redis-cache-1 redis-cli FLUSHALL || true

            echo "🔢 Проверка версий frappe/erpnext против versions.lock..."
            EXP_FRAPPE=$(grep '^frappe=' services/erp/versions.lock | cut -d= -f2)
            EXP_ERPNEXT=$(grep '^erpnext=' services/erp/versions.lock | cut -d= -f2)
            GOT_FRAPPE=$(docker exec erp-backend-1 bash -c "grep -o '16[0-9.]*' /home/frappe/frappe-bench/apps/frappe/frappe/__init__.py | head -1")
            GOT_ERPNEXT=$(docker exec erp-backend-1 bash -c "grep -o '16[0-9.]*' /home/frappe/frappe-bench/apps/erpnext/erpnext/__init__.py | head -1")
            if [ "$EXP_FRAPPE" != "$GOT_FRAPPE" ] || [ "$EXP_ERPNEXT" != "$GOT_ERPNEXT" ]; then
              echo "❌ DEPLOY FAILED: version skew. ожидали frappe=$EXP_FRAPPE erpnext=$EXP_ERPNEXT, получили frappe=$GOT_FRAPPE erpnext=$GOT_ERPNEXT"
              exit 1
            fi
            echo "✅ Версии совпадают: frappe=$GOT_FRAPPE erpnext=$GOT_ERPNEXT"

            echo "🔍 Smoke-тест: ассеты доехали до nginx?"
            EXPECTED=$(grep -o 'SAAS_THEME_BUILD = "[^"]*"' services/erp/saas_theme/saas_theme/public/js/saas_theme.js | head -1)
            DEPLOYED=$(curl -s "http://localhost:8080/assets/saas_theme/js/saas_theme.js" | grep -o 'SAAS_THEME_BUILD = "[^"]*"' | head -1)
            if [ "$EXPECTED" != "$DEPLOYED" ]; then
              echo "❌ DEPLOY FAILED: сервер отдаёт старый saas_theme.js (ожидали: $EXPECTED, получили: $DEPLOYED)"
              exit 1
            fi
            echo "✅ Assets доехали: $DEPLOYED"

            echo "✅ ERP обновлён"
